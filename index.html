<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake 10x10</title>
  <style>
    :root { --size: 400px; --grid: 10; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
      color: #e6e6e6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      display: grid;
      gap: 12px;
      justify-items: center;
    }
    canvas {
      width: var(--size);
      height: var(--size);
      border: 1px solid #333;
      background: #1b1b1b;
      image-rendering: pixelated;
    }
    .hud { display: flex; gap: 16px; align-items: center; }
    .badge { padding: 6px 10px; border: 1px solid #333; border-radius: 6px; }
    .win {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px);
      color: #fff;
      font-weight: 600;
      font-size: 22px;
    }
    .grid-hint { font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="badge">Eaten: <span id="eaten">0</span>/10</div>
      <div class="badge">Controls: Arrow keys</div>
      <div class="grid-hint">15×15 grid; one red pixel spawns every 10s</div>
    </div>
    <div style="position: relative;">
      <canvas id="game" width="400" height="400" aria-label="Snake game canvas"></canvas>
      <div id="win" class="win">You ate 10 red pixels! Press R to restart.</div>
    </div>
  </div>

  <script>
    (function() {
      const GRID_SIZE = 15;
      const CANVAS_SIZE = 400;
      const CELL = CANVAS_SIZE / GRID_SIZE; // 40px per cell

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const eatenEl = document.getElementById('eaten');
      const winEl = document.getElementById('win');

      // Game state
      let snake = [ {x: 2, y: 5}, {x: 1, y: 5}, {x: 0, y: 5} ];
      let dir = { x: 1, y: 0 }; // start moving right
      let nextDir = { x: 1, y: 0 };
      let foods = []; // multiple red pixels can exist
      let eatenCount = 0;
      let gameInterval = null;
      let foodInterval = null;
      let running = false;

      function drawCell(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }

      function drawGrid() {
        ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        // subtle grid background
        ctx.strokeStyle = '#262626';
        ctx.lineWidth = 1;
        for (let i = 0; i <= GRID_SIZE; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL, 0);
          ctx.lineTo(i * CELL, CANVAS_SIZE);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * CELL);
          ctx.lineTo(CANVAS_SIZE, i * CELL);
          ctx.stroke();
        }
      }

      function render() {
        drawGrid();
        // draw foods (red)
        for (const f of foods) {
          drawCell(f.x, f.y, '#d93636');
        }
        // draw snake (green)
        for (let i = 0; i < snake.length; i++) {
          const seg = snake[i];
          drawCell(seg.x, seg.y, i === snake.length - 1 ? '#00a8ff' : '#1f8b4d');
        }
      }

      function wrap(n) {
        // toroidal wrap-around to keep gameplay simple
        if (n < 0) return GRID_SIZE - 1;
        if (n >= GRID_SIZE) return 0;
        return n;
      }

      function cellOccupied(x, y) {
        // check snake cells
        for (const s of snake) { if (s.x === x && s.y === y) return true; }
        // check existing foods
        for (const f of foods) { if (f.x === x && f.y === y) return true; }
        return false;
      }

      function spawnFood() {
        if (!running) return;
        if (eatenCount >= 10) return; // no more spawns once goal achieved
        if (foods.length >= 1) return; // only one food at a time
        // place one new red pixel at a random empty cell
        let tries = 0;
        let x, y;
        do {
          x = Math.floor(Math.random() * GRID_SIZE);
          y = Math.floor(Math.random() * GRID_SIZE);
          tries++;
          if (tries > 100) break; // fail-safe
        } while (cellOccupied(x, y));
        if (!cellOccupied(x, y)) {
          foods.push({ x, y });
        }
      }

      function gameTick() {
        // apply any queued direction change (prevents instant reverse)
        if ((nextDir.x !== -dir.x || nextDir.y !== -dir.y)) {
          dir = nextDir;
        }
        const head = snake[snake.length - 1];
        const newHead = { x: wrap(head.x + dir.x), y: wrap(head.y + dir.y) };

        // check if food eaten at new head
        let ate = false;
        for (let i = 0; i < foods.length; i++) {
          const f = foods[i];
          if (f.x === newHead.x && f.y === newHead.y) {
            foods.splice(i, 1);
            eatenCount++;
            eatenEl.textContent = String(eatenCount);
            ate = true;
            break;
          }
        }

        snake.push(newHead);
        if (!ate) {
          snake.shift(); // move without growing
        }

        if (eatenCount >= 10) {
          endGame(true);
          return;
        }

        render();
      }

      function startGame() {
        running = true;
        render();
        gameInterval = setInterval(gameTick, 192); // 20% slower movement
        // spawn a new red pixel every 10 seconds (adds up, capped by victory)
        foodInterval = setInterval(spawnFood, 10000);
      }

      function endGame(victory) {
        running = false;
        clearInterval(gameInterval);
        clearInterval(foodInterval);
        if (victory) {
          winEl.style.display = 'flex';
        }
      }

      // Controls
      window.addEventListener('keydown', (e) => {
        const key = e.key;
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)) {
          e.preventDefault();
        }
        if (key === 'ArrowUp') {
          nextDir = { x: 0, y: -1 };
        } else if (key === 'ArrowDown') {
          nextDir = { x: 0, y: 1 };
        } else if (key === 'ArrowLeft') {
          nextDir = { x: -1, y: 0 };
        } else if (key === 'ArrowRight') {
          nextDir = { x: 1, y: 0 };
        } else if (key.toLowerCase() === 'r' && !running) {
          // simple restart: reload state
          snake = [ {x: 2, y: 5}, {x: 1, y: 5}, {x: 0, y: 5} ];
          dir = { x: 1, y: 0 };
          nextDir = { x: 1, y: 0 };
          foods = [];
          eatenCount = 0;
          eatenEl.textContent = '0';
          winEl.style.display = 'none';
          startGame();
        }
      });

      // boot
      startGame();
    })();
  </script>
</body>
</html>
